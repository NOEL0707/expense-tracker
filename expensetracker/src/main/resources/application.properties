spring.application.name=expensetracker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/expensetracker;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.servlet.context-path=/api/v1
server.shutdown=graceful
server.forward-headers-strategy=framework
server.compression.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.env.access=none
management.info.env.enabled=true
info.app.name=Expense Tracker API
info.app.version=1.0.0
springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/swagger-ui
springdoc.show-actuator=true
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
